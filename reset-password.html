<!DOCTYPE html>
<html lang="en" data-skin="noir" data-lite="off">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set a new password — Arcade Campus Hub</title>
  <meta name="description" content="Set a new password after following the reset link from your email.">
  <meta name="theme-color" content="#0c0d10">
  <meta name="robots" content="noindex,follow">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/core/theme-boot.js"></script>
  <script src="js/core/consent-gate.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-shell="chrome"></div>

  <main class="main" id="main">
    <div class="gate">
      <header class="page-head" style="border:0;margin-bottom:1rem">
        <span class="label">Account</span>
        <h1>Set a new password</h1>
        <p id="intro">Checking your reset link…</p>
      </header>

      <div class="panel" id="invalid" hidden>
        <p class="dim" style="margin:0">
          This reset link is missing, expired, or already used.
          <a href="forgot-password.html">Request a new one</a>.
        </p>
      </div>

      <form class="panel form" id="form" hidden>
        <div class="field">
          <label for="password">New password</label>
          <div class="pw-field">
            <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
            <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" aria-pressed="false">👁</button>
          </div>
          <p class="hint">At least 8 characters, with a letter and a number.</p>
        </div>

        <div class="field">
          <label for="confirm">Confirm password</label>
          <div class="pw-field">
            <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>
            <button type="button" class="pw-toggle" id="confirm-toggle" aria-label="Show password" aria-pressed="false">👁</button>
          </div>
        </div>

        <p class="form-error" id="error" hidden></p>

        <button class="btn btn-cta" type="submit" id="submit" style="width:100%">Set password</button>
      </form>
    </div>

    <div data-shell="foot"></div>
  </main>

  <script src="js/core/config.js"></script>
  <script src="data/games.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/features/catalog-overlay.js"></script>
  <script src="js/features/catalog.js"></script>
  <script src="js/features/art.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/password-toggle.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/api-supabase.js"></script>
  <script src="js/core/session.js"></script>
  <script src="js/features/capture.js"></script>
  <script src="js/features/chat-dock.js"></script>
  <script src="js/features/call.js"></script>
  <script src="js/features/game-saves.js"></script>
  <script src="js/features/shell.js"></script>
  <script src="js/pages/page-reset-password.js"></script>
</body>
</html>

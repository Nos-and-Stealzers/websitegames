<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>2048</title>
<style>
  :root { --bg:#0c0d10; --board:#191b20; --cell:#25272e; --ink:#e8eaed; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:ui-monospace,Menlo,Consolas,monospace;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100dvh; gap:14px; padding:14px; user-select:none;
  }
  .top { display:flex; align-items:center; gap:14px; width:min(420px,92vw); }
  h1 { font-size:30px; margin:0; letter-spacing:-1px; }
  .scores { margin-left:auto; display:flex; gap:8px; }
  .score { background:var(--cell); padding:6px 12px; text-align:center; min-width:74px; }
  .score b { display:block; font-size:10px; letter-spacing:.14em; color:#8a8f99; text-transform:uppercase; }
  .score span { font-size:18px; font-weight:700; }
  #board {
    position:relative; width:min(420px,92vw); aspect-ratio:1;
    background:var(--board); padding:10px; display:grid;
    grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr); gap:10px;
  }
  .bg { background:var(--cell); }
  .tile {
    position:absolute; display:grid; place-items:center;
    font-weight:800; border-radius:2px;
    transition:transform .12s ease; will-change:transform;
  }
  .tile.pop { animation:pop .16s ease; }
  @keyframes pop { 0%{transform:scale(.3)} 100%{transform:scale(1)} }
  .row { display:flex; gap:10px; width:min(420px,92vw); }
  button {
    flex:1; background:var(--cell); color:var(--ink); border:1px solid #35373f;
    padding:10px; font:inherit; cursor:pointer;
  }
  button:hover { border-color:#f2b705; color:#f2b705; }
  .msg {
    position:absolute; inset:10px; display:none; place-items:center;
    background:rgba(12,13,16,.86); font-size:26px; font-weight:800; flex-direction:column; gap:10px;
  }
  .msg.on { display:grid; }
  .hint { font-size:12px; color:#8a8f99; }
</style>
</head>
<body>
  <div class="top">
    <h1>2048</h1>
    <div class="scores">
      <div class="score"><b>Score</b><span id="s">0</span></div>
      <div class="score"><b>Best</b><span id="b">0</span></div>
    </div>
  </div>
  <div id="board">
    <div class="msg" id="msg"><div id="msgt"></div><div class="hint">press New game</div></div>
  </div>
  <div class="row"><button id="new">New game</button></div>
  <div class="hint">Arrows / WASD to move &middot; swipe on touch</div>
<script>
(function(){
  "use strict";
  var N=4, board, score=0, best=+(localStorage.getItem("o2048.best")||0);
  var grid=document.getElementById("board");
  var msg=document.getElementById("msg"), msgt=document.getElementById("msgt");
  var COLORS={2:"#3a3d46",4:"#4a4230",8:"#8a5a1e",16:"#a5591a",32:"#b8471e",
    64:"#c53a1e",128:"#c8a020",256:"#c9a820",512:"#c9ab1e",1024:"#caae14",2048:"#cbb002"};
  for(var i=0;i<16;i++){var d=document.createElement("div");d.className="bg";grid.appendChild(d);}
  var tiles={}; var uid=0;

  function cellRect(){var s=(grid.clientWidth-20-30)/4;return {s:s,gap:10,pad:10};}
  function place(t){
    var m=cellRect();
    t.el.style.width=m.s+"px";t.el.style.height=m.s+"px";
    t.el.style.fontSize=(t.v>=1000?m.s*0.30:m.s*0.42)+"px";
    var x=m.pad+t.c*(m.s+m.gap), y=m.pad+t.r*(m.s+m.gap);
    t.el.style.transform="translate("+x+"px,"+y+"px)";
  }
  function make(r,c,v){
    var el=document.createElement("div");el.className="tile pop";
    el.style.background=COLORS[v]||"#cbb002";el.style.color=v<=4?"#e8eaed":"#101216";
    el.textContent=v;grid.appendChild(el);
    var t={id:++uid,r:r,c:c,v:v,el:el};tiles[t.id]=t;place(t);
    setTimeout(function(){el.classList.remove("pop");},160);
    return t;
  }
  function reset(){
    Object.keys(tiles).forEach(function(k){tiles[k].el.remove();});tiles={};
    board=[];for(var r=0;r<N;r++){board.push([0,0,0,0]);}
    score=0;render();msg.classList.remove("on");spawn();spawn();
  }
  function empties(){var e=[];for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(!board[r][c])e.push([r,c]);return e;}
  function spawn(){
    var e=empties();if(!e.length)return;
    var p=e[Math.floor(Math.random()*e.length)];var v=Math.random()<0.9?2:4;
    board[p[0]][p[1]]=make(p[0],p[1],v);
  }
  function render(){
    document.getElementById("s").textContent=score;
    document.getElementById("b").textContent=best;
  }
  function tileAt(r,c){return board[r][c]||null;}

  function move(dir){
    // dir: 0 up,1 right,2 down,3 left
    var moved=false, gained=0;
    var order=[];
    for(var r=0;r<N;r++)for(var c=0;c<N;c++)order.push([r,c]);
    if(dir===1||dir===2)order.reverse();
    var merged={};
    function step(r,c){
      var t=tileAt(r,c);if(!t)return;
      var dr=dir===0?-1:dir===2?1:0, dc=dir===3?-1:dir===1?1:0;
      var nr=r,nc=c;
      while(true){
        var tr=nr+dr,tc=nc+dc;
        if(tr<0||tr>=N||tc<0||tc>=N)break;
        var o=tileAt(tr,tc);
        if(!o){nr=tr;nc=tc;continue;}
        if(o.v===t.v && !merged[o.id] && !merged[t.id]){
          // merge
          board[r][c]=0;board[tr][tc]=o;
          o.v*=2;o.el.textContent=o.v;o.el.style.background=COLORS[o.v]||"#cbb002";
          o.el.style.color=o.v<=4?"#e8eaed":"#101216";o.el.classList.add("pop");
          setTimeout(function(x){return function(){x.classList.remove("pop");};}(o.el),160);
          merged[o.id]=true;t.el.remove();delete tiles[t.id];
          score+=o.v;gained+=o.v;moved=true;
          if(o.v>=2048)win();
          setTimeout(function(){place(o);},0);
          return;
        }
        break;
      }
      if(nr!==r||nc!==c){board[r][c]=0;board[nr][nc]=t;t.r=nr;t.c=nc;place(t);moved=true;}
    }
    // iterate in gravity order
    var seq=[];for(var i=0;i<N;i++)for(var j=0;j<N;j++)seq.push([i,j]);
    if(dir===0){seq.sort(function(a,b){return a[0]-b[0];});}
    if(dir===2){seq.sort(function(a,b){return b[0]-a[0];});}
    if(dir===3){seq.sort(function(a,b){return a[1]-b[1];});}
    if(dir===1){seq.sort(function(a,b){return b[1]-a[1];});}
    seq.forEach(function(p){step(p[0],p[1]);});
    if(moved){
      if(score>best){best=score;localStorage.setItem("o2048.best",best);}
      render();setTimeout(spawn,120);setTimeout(checkOver,240);
    }
  }
  function canMove(){
    if(empties().length)return true;
    for(var r=0;r<N;r++)for(var c=0;c<N;c++){
      var v=board[r][c].v;
      if(c<N-1&&board[r][c+1].v===v)return true;
      if(r<N-1&&board[r+1][c].v===v)return true;
    }
    return false;
  }
  function checkOver(){if(!canMove()){msgt.textContent="Game over";msg.classList.add("on");}}
  function win(){msgt.textContent="You made 2048!";msg.classList.add("on");}

  document.addEventListener("keydown",function(e){
    var k=e.key.toLowerCase(),d=null;
    if(k==="arrowup"||k==="w")d=0;else if(k==="arrowright"||k==="d")d=1;
    else if(k==="arrowdown"||k==="s")d=2;else if(k==="arrowleft"||k==="a")d=3;
    if(d!==null){e.preventDefault();move(d);}
  });
  var sx,sy;
  grid.addEventListener("touchstart",function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
  grid.addEventListener("touchend",function(e){
    if(sx==null)return;var t=e.changedTouches[0];var dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:3);else move(dy>0?2:0);
    sx=sy=null;
  },{passive:true});
  document.getElementById("new").addEventListener("click",reset);
  window.addEventListener("resize",function(){Object.keys(tiles).forEach(function(k){place(tiles[k]);});});
  render();reset();
})();
</script>
</body>
</html>

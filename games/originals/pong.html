<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pong</title>
<style>
  :root{--bg:#0c0d10;--panel:#15171c;--line:#2a2c33;--ink:#e8eaed;--mut:#8a8f99;--acc:#f2b705;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;
    display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;
    gap:12px;padding:12px;user-select:none;}
  .top{display:flex;gap:16px;width:min(560px,94vw);align-items:baseline;}
  h1{font-size:24px;margin:0;letter-spacing:-1px;}
  .sc{margin-left:auto;font-size:15px;color:var(--mut);}
  .sc b{color:var(--acc);}
  canvas{background:var(--panel);border:1px solid var(--line);width:min(560px,94vw);height:auto;touch-action:none;}
  .over{color:var(--acc);font-weight:700;min-height:16px;text-align:center;}
  .row{display:flex;gap:8px;width:min(560px,94vw);}
  button{flex:1;background:#25272e;color:var(--ink);border:1px solid #35373f;padding:10px;font:inherit;cursor:pointer;}
  button:hover{border-color:var(--acc);color:var(--acc);}
  button.on{border-color:var(--acc);color:var(--acc);}
  .hint{font-size:12px;color:var(--mut);text-align:center;}
</style>
</head>
<body>
  <div class="top"><h1>Pong</h1><div class="sc">you <b id="p">0</b> &middot; cpu <b id="e">0</b> &middot; first to <b>7</b></div></div>
  <canvas id="c" width="560" height="360"></canvas>
  <div class="over" id="over">Move mouse or drag to start</div>
  <div class="row"><button id="start">New game</button><button id="diff">Difficulty: Normal</button></div>
  <div class="hint">Mouse / touch / W-S / Up-Down &middot; Space to pause</div>
<script>
(function(){
  "use strict";
  var cv=document.getElementById("c"),ctx=cv.getContext("2d");
  var W=cv.width,H=cv.height,PW=10,PH=64,BS=9;
  var py,ey,pv,ball,ps,es,running=false,over=false,timer=null;
  var diffs=[["Easy",4.2,0.06],["Normal",5.4,0.10],["Hard",7.0,0.16]],di=1;
  document.getElementById("diff").textContent="Difficulty: "+diffs[di][0];

  function reset(serveToPlayer){
    py=(H-PH)/2;ey=(H-PH)/2;pv=0;
    ball={x:W/2,y:H/2,vx:(serveToPlayer?-1:1)*diffs[di][1],vy:(Math.random()*2-1)*3};
  }
  function newGame(){ps=0;es=0;over=false;upd();reset(Math.random()<0.5);document.getElementById("over").textContent="";run();}
  function run(){running=true;clearInterval(timer);timer=setInterval(tick,1000/60);}
  function stop(){running=false;clearInterval(timer);}
  function upd(){document.getElementById("p").textContent=ps;document.getElementById("e").textContent=es;}

  function tick(){
    py+=pv;py=Math.max(0,Math.min(H-PH,py));
    // ai tracks ball with capped speed
    var target=ball.y-PH/2, aispeed=diffs[di][1]*0.9;
    if(ey+PH/2<ball.y-8)ey+=aispeed; else if(ey+PH/2>ball.y+8)ey-=aispeed;
    ey=Math.max(0,Math.min(H-PH,ey));

    ball.x+=ball.vx;ball.y+=ball.vy;
    if(ball.y<BS/2){ball.y=BS/2;ball.vy*=-1;}
    if(ball.y>H-BS/2){ball.y=H-BS/2;ball.vy*=-1;}
    // player paddle (left)
    if(ball.x-BS/2<PW+6 && ball.vx<0 && ball.y>py && ball.y<py+PH){
      ball.x=PW+6+BS/2;bounce(py);
    }
    // cpu paddle (right)
    if(ball.x+BS/2>W-PW-6 && ball.vx>0 && ball.y>ey && ball.y<ey+PH){
      ball.x=W-PW-6-BS/2;bounce(ey);
    }
    if(ball.x<0){es++;score(true);}
    else if(ball.x>W){ps++;score(false);}
    draw();
  }
  function bounce(paddleY){
    var rel=((ball.y-paddleY)/PH)-0.5; // -0.5..0.5
    var speed=Math.min(Math.hypot(ball.vx,ball.vy)*1.06,14);
    var dir=ball.vx<0?1:-1;
    ball.vx=dir*speed*Math.cos(rel*0.9);
    ball.vy=speed*Math.sin(rel*1.1)+rel*2;
  }
  function score(toCpu){
    upd();
    if(ps>=7||es>=7){over=true;stop();
      document.getElementById("over").textContent=ps>=7?"You win! Press New game":"CPU wins — press New game";
      draw();return;}
    reset(!toCpu);
  }
  function draw(){
    ctx.fillStyle="#15171c";ctx.fillRect(0,0,W,H);
    ctx.strokeStyle="#2a2c33";ctx.setLineDash([6,10]);
    ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle="#e8eaed";ctx.fillRect(6,py,PW,PH);
    ctx.fillStyle="#4f8cff";ctx.fillRect(W-PW-6,ey,PW,PH);
    ctx.fillStyle="#f2b705";ctx.fillRect(ball.x-BS/2,ball.y-BS/2,BS,BS);
  }
  function setPaddleTo(clientY){
    var r=cv.getBoundingClientRect();
    var y=(clientY-r.top)*(H/r.height)-PH/2;
    py=Math.max(0,Math.min(H-PH,y));pv=0;
  }
  cv.addEventListener("mousemove",function(e){if(!over)setPaddleTo(e.clientY);});
  cv.addEventListener("touchmove",function(e){if(!over){setPaddleTo(e.touches[0].clientY);e.preventDefault();}},{passive:false});
  document.addEventListener("keydown",function(e){
    var k=e.key.toLowerCase();
    if(k==="w"||k==="arrowup"){pv=-7;e.preventDefault();}
    else if(k==="s"||k==="arrowdown"){pv=7;e.preventDefault();}
    else if(k===" "){e.preventDefault();if(!over)running?stop():run();}
  });
  document.addEventListener("keyup",function(e){
    var k=e.key.toLowerCase();
    if(k==="w"||k==="s"||k==="arrowup"||k==="arrowdown")pv=0;
  });
  document.getElementById("start").addEventListener("click",newGame);
  document.getElementById("diff").addEventListener("click",function(){
    di=(di+1)%diffs.length;this.textContent="Difficulty: "+diffs[di][0];newGame();
  });
  reset(true);draw();newGame();stop();document.getElementById("over").textContent="Move mouse or drag to start";
  // auto-start on first interaction handled by run() inside newGame; keep paused until move
  var kicked=false;
  function kick(){if(!kicked&&!over){kicked=true;run();}}
  cv.addEventListener("mousemove",kick);cv.addEventListener("touchstart",kick);
  document.addEventListener("keydown",kick);
})();
</script>
</body>
</html>
